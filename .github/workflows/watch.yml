name: Mootse grade watcher

on:
  schedule:
    # Every 10 min (public repo = unlimited free minutes).
    # GitHub may start scheduled runs a few minutes late.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button for testing

permissions:
  contents: write         # needed to commit state.json

concurrency:
  group: mootse-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check grades
        env:
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 mootse_watch.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update grade state"
            git push
          fi
