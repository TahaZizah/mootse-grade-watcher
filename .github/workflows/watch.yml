name: Mootse grade watcher

# GitHub's cron is unreliable on this repo, so each run waits ~10 min and then
# starts the next run itself (workflow_dispatch via GITHUB_TOKEN). The cron
# below is only a backup that restarts the chain if it ever breaks; the
# concurrency group guarantees only one chain runs at a time.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # commit state.json
  actions: write    # start the next run

concurrency:
  group: mootse-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check grades
        env:
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 mootse_watch.py

      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update grade state"
            git push
          fi

      - name: Wait, then start the next check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 570
          gh workflow run watch.yml --repo "$GITHUB_REPOSITORY" --ref main
