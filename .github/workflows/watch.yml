name: Mootse grade watcher

# Started every 5 minutes by cron-job.org (workflow_dispatch via the GitHub API).
# Each run is independent: if GitHub fails to start one, the next one still comes.
# healthchecks.io (HC_PING_URL) alerts you if no check succeeds for 30 minutes.
# GitHub's own cron below is just an extra backup (it is unreliable on its own).
on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write   # commit state.json

concurrency:
  group: mootse-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Check grades
        env:
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
        run: python3 mootse_watch.py

      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update grade state"
            for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
          fi
